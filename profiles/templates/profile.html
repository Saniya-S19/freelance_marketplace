<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | PitchPod</title>
    <style>
        :root {
            --bg-cream: #FAF7F0; 
            --brand-burgundy: #721C24; 
            --brand-burgundy-hover: #5A161C;
            --text-dark: #331A1C; 
            --text-muted: #665557;
            --border-color: rgba(114, 28, 36, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-cream); color: var(--text-dark); display: flex; justify-content: center; padding: 4rem 2rem; }
        
        .profile-container {
            background: #ffffff; width: 100%; max-width: 600px; padding: 3rem;
            border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(114, 28, 36, 0.05);
        }
        .header-section { margin-bottom: 2rem; text-align: center; }
        .header-section h1 { color: var(--brand-burgundy); font-size: 2rem; margin-bottom: 0.5rem; }
        .badge { background: rgba(114, 28, 36, 0.1); color: var(--brand-burgundy); padding: 0.4rem 1rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-cream); outline: none; }
        .form-group input:focus { border-color: var(--brand-burgundy); }
        
        .btn-submit { width: 100%; background: var(--brand-burgundy); color: #fff; border: none; padding: 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-submit:hover { background: var(--brand-burgundy-hover); }
        .btn-back { display: block; text-align: center; margin-top: 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="header-section">
            <h1>My Profile</h1>
            <span class="badge">{{ profile.role }} Account</span>
        </div>

        <form method="POST" action="{% url 'my_profile' %}">
            {% csrf_token %}
            
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>First Name</label>
                    <input type="text" name="first_name" value="{{ request.user.first_name }}">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Last Name</label>
                    <input type="text" name="last_name" value="{{ request.user.last_name }}">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ request.user.email }}" required>
            </div>

            <div class="form-group">
                <label>Professional Title {% if profile.role == 'client' %}(or Company Name){% endif %}</label>
                <input type="text" name="title" value="{{ profile.title }}" placeholder="e.g., Senior Django Developer">
            </div>

            <!-- Only show skills input if the user is a freelancer -->
            {% if profile.role == 'freelancer' %}
            <div class="form-group">
                <label>Tech Stack / Skills</label>
                <input type="text" name="skills" value="{{ profile.skills }}" placeholder="e.g., Python, Django, React, PostgreSQL">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem;">Separate skills with commas.</p>
            </div>
            {% endif %}

            <button type="submit" class="btn-submit">Save Changes</button>
            
            <!-- Dynamic back button based on role -->
            <a href="{% if profile.role == 'client' %}{% url 'client' %}{% else %}{% url 'freelancer' %}{% endif %}" class="btn-back">
                &larr; Back to Dashboard
            </a>
        </form>
    </div>

</body>
</html>
