<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | PitchPod</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ===== BURGUNDY & CREAM COLOR PALETTE ===== */
        :root {
            --bg-cream: #FAF7F0; 
            --bg-cream-alt: #F2EFE8; 
            --brand-burgundy: #721C24; 
            --brand-burgundy-hover: #5A161C;
            --text-dark: #331A1C; 
            --text-cream: #FAF7F0;
        }

        * {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }

        /* ===== SIGNUP PAGE BACKGROUND ===== */
        .signup-body {
            background: radial-gradient(circle at center, var(--bg-cream) 0%, var(--bg-cream-alt) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: var(--text-dark);
            padding: 40px 20px;
        }

        /* ===== WRAPPER ===== */
        .signup-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* ===== SIGNUP CARD ===== */
        .signup-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(114, 28, 36, 0.08);
            border: 1px solid rgba(114, 28, 36, 0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .signup-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(114, 28, 36, 0.12);
        }

        /* ===== TITLE ===== */
        .title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .brand {
            color: var(--brand-burgundy);
        }

        .subtitle {
            font-size: 14px;
            color: #665557;
            margin-bottom: 25px;
        }

        /* ===== INPUTS & SELECTS ===== */
        .signup-card label {
            float: left;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .signup-card input, 
        .signup-card select {
            width: 100%;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #E0D8D9;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        /* Fix Bootstrap overriding select background */
        .signup-card select {
            appearance: form-select;
        }

        .signup-card input:focus,
        .signup-card select:focus {
            border-color: var(--brand-burgundy);
            box-shadow: 0 0 0 3px rgba(114, 28, 36, 0.15); 
            background-color: #ffffff;
            outline: none;
        }

        /* ===== SIGNUP BUTTON ===== */
        .signup-btn {
            width: 100%;
            background-color: var(--brand-burgundy);
            color: var(--text-cream);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            border: 2px solid var(--brand-burgundy);
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .signup-btn:hover {
            background-color: var(--bg-cream);
            color: var(--brand-burgundy);
            transform: translateY(-2px);
        }

        /* ===== BOTTOM TEXT ===== */
        .bottom-text {
            margin-top: 25px;
            font-size: 14px;
            color: #665557;
        }

        .bottom-text a {
            color: var(--brand-burgundy);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .bottom-text a:hover {
            color: var(--brand-burgundy-hover);
            text-decoration: underline;
        }

        /* ===== ALERTS ===== */
        .alert-danger {
            background-color: #F8D7DA;
            color: var(--brand-burgundy);
            border: 1px solid #F5C6CB;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
        }
    </style>
</head>

<body class="signup-body">

<div class="signup-wrapper">

    <div class="signup-card">

        <h2 class="title">Join <span class="brand">PitchPod</span></h2>
        <p class="subtitle">Create your account to get started</p>

        <!-- Upgraded Messages from JS alert to smooth HTML alert -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div>
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>

            <div>
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>

            <div>
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
            </div>

            <div>
                <label>Role</label>
                <select name="role" class="form-select" required>
                    <option value="" disabled selected>-- Choose your path --</option>
                    <option value="client">Client (I want to hire Pods)</option>
                    <option value="freelancer">Freelancer (I want to join/create Pods)</option>
                </select>
            </div>

            <button type="submit" class="btn signup-btn">Create Account</button>
        </form>

        <p class="bottom-text">
            Already have an account? 
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>

</body>
</html>
