<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>


body {
    font-family: "Poppins", sans-serif;
    margin: 0;
    padding: 0;
    background: #f8f9fa;
}

/* =========================
   SIGNUP BACKGROUND
========================= */
.signup-body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: #f8fafc;
}

.signup-body::before {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: #4f46e5;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.18;
    top: -120px;
    left: -120px;
}

.signup-body::after {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    background: #6366f1;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    bottom: -120px;
    right: -120px;
}

/* =========================
   SIGNUP CARD
========================= */
.signup-container {
    position: relative;
    z-index: 2;
    width: 380px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* Title */
.signup-container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

/* Labels */
label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: #444;
}

/* Inputs + Select */
input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    transition: 0.3s;
    font-size: 14px;
}

/* Focus */
input:focus, select:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 8px rgba(79,70,229,0.25);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg,#4f46e5,#6366f1);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(79,70,229,0.25);
}

/* Login link */
.signup-container a {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #4f46e5;
    text-decoration: none;
    font-weight: 500;
}

.signup-container a:hover {
    text-decoration: underline;
}

</style>

</head>

<body class="signup-body">

<div class="signup-container">

    <h2>Create Account</h2>

    {% if messages %}
        {% for message in messages %}
            <script>
                alert("{{ message }}");
            </script>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>

        <label>Role</label>
        <select name="role" required>
            <option value="">-- Choose Role --</option>
            <option value="client">Client</option>
            <option value="freelancer">Freelancer</option>
        </select>

        <button type="submit">Sign Up</button>
    </form>

    <a href="{% url 'login' %}">Already have an account? Login</a>

</div>

</body>
</html>
